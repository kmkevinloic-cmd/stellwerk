name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "tag v$tag does not match VERSION $file" >&2
            exit 1
          fi
          scripts/version.sh check

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: test
        run: make test

      - name: build stellwerkd
        run: |
          v="$(cat VERSION)"
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd control-plane && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o ../dist/stellwerkd-$v-linux-$arch ./cmd/stellwerkd)
          done
          (cd dist && sha256sum stellwerkd-* > SHA256SUMS)

      - name: release notes from CHANGELOG
        run: |
          v="$(cat VERSION)"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Stellwerk $GITHUB_REF_NAME" \
            --notes-file dist/NOTES.md \
            dist/stellwerkd-* dist/SHA256SUMS
